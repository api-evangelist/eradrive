name: EraDrive
description: >-
  EraDrive is a space technology company building compact, AI-powered self-driving modules that give
  spacecraft onboard autonomy — vision-based navigation, control, collision avoidance, and situational
  awareness computed at the edge. A Stanford Space Rendezvous Laboratory (SLAB) spinoff founded by Sumant
  Sharma (CEO), Justin Kruger (CTO), and Prof. Simone D'Amico (CSO), EraDrive integrates flight-proven
  autonomy software with existing satellite infrastructure for space traffic management, on-orbit
  servicing and logistics, and advanced remote sensing across commercial and defense missions. The
  company closed an oversubscribed $5.3M seed round in December 2025, co-led by Haystack Ventures with
  participation from Point Nine, Harpoon Ventures, Brave Capital, 2100 VC, and Entropy Industrial Capital.
  As an early-stage hardware/software company, EraDrive currently publishes no public API, developer
  portal, or documentation surface.
